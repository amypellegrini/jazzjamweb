name: Shared Content

on:
  pull_request:
    branches: [main]

jobs:
  no-hand-edits:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block hand edits to generated shared content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Files rendered by the private jazzjam-workbench from its canonical
          # content/shared.json. See SHARED_CONTENT_SPEC.md.
          GENERATED="
          src/_data/shared.json
          "

          fail=0
          for f in $GENERATED; do
            # Unchanged in this PR? Nothing to check.
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$f"; then
              continue
            fi

            for sha in $(git log --format=%H "$BASE_SHA".."$HEAD_SHA" -- "$f"); do
              subject=$(git log -1 --format=%s "$sha")
              case "$subject" in
                "chore(sync):"*)
                  echo "ok: $f updated by sync commit $(git log -1 --format=%h "$sha")"
                  ;;
                *)
                  echo "::error file=$f::$f is generated and was edited by $(git log -1 --format=%h "$sha") ($subject)"
                  fail=1
                  ;;
              esac
            done
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Generated shared content was edited outside the sync flow."
            echo ""
            echo "To change it: edit content/shared.json in the jazzjam-workbench,"
            echo "run 'npm run sync' from the workbench root, then commit the"
            echo "regenerated files here with a 'chore(sync):' subject."
            echo ""
            echo "See SHARED_CONTENT_SPEC.md."
            exit 1
          fi

          echo "No hand edits to generated shared content."
