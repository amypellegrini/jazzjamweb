name: Shared Content

on:
  pull_request:
    # 'edited' catches a stacked PR retargeted onto main after its parent
    # merges, which would otherwise never re-run the gate.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  # Covers direct human pushes to main. Merged PRs are re-checked here too,
  # which is cheap and keeps the trigger simple.
  push:
    branches: [main]

concurrency:
  group: shared-content-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-hand-edits:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            # Resolve the LIVE base branch, not the base.sha recorded in the
            # event payload. A branch that has since merged main in would take
            # its merge base against that stale sha and drag mainline commits
            # into the range.
            git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
            echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            # Branch creation reports an all-zero 'before'; there is no range to
            # judge, so skip rather than fail closed on a non-event.
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            echo "base=${PUSH_BEFORE}" >> "$GITHUB_OUTPUT"
            echo "head=${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Block hand edits to generated shared content
        if: steps.range.outputs.skip != 'true'
        run: |
          node scripts/check-shared-content.js \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}"
